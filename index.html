<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liquor License Market | National Marketplace</title>
  <meta name="description" content="Liquor License Market — a national marketplace for liquor licenses." />
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#071d33}
    body{overflow-x:hidden}
    .hero-stage{width:100%;background:#0f243f;padding-bottom:64px}
    #hero{display:block;width:100%;height:auto;max-width:1660px;margin:0 auto}
    @media(max-width:700px){.hero-stage{padding-bottom:36px}}
  </style>
</head>
<body>
  <div class="hero-stage">
    <img id="hero" alt="Liquor License Market — The Nation's Marketplace for Liquor Licenses" />
  </div>
  <script>
    fetch('/assets/p1.txt',{cache:'no-store'})
      .then(r=>{if(!r.ok) throw new Error('hero data'); return r.text();})
      .then(data=>{document.getElementById('hero').src='data:image/webp;base64,'+data.trim();})
      .catch(()=>{document.body.innerHTML='<div style="color:white;font:20px Arial;padding:40px">Loading Liquor License Market…</div>';});
  </script>
</body>
</html>
