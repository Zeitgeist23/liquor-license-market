<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquor License Market | National Marketplace</title>
<meta name="description" content="Liquor License Market — the nation's marketplace for buying, selling, and financing liquor licenses.">
<style>
:root{--navy:#071d33;--hero:#071d33;--light:#0f243f;--gold:#eda91a;--white:#f6f3ed}
*{box-sizing:border-box}
html{margin:0;width:100%;min-height:100%;background:var(--navy)}
body{margin:0;width:100%;min-height:100vh;background:var(--navy);color:var(--white);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
.hero-wrap{width:100%;background:var(--light)}
.hero{position:relative;width:100vw;max-width:none;margin:0;aspect-ratio:1400/729;overflow:hidden;background:var(--hero)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;user-select:none}
.hero-tail{height:64px;width:100%;background:var(--light)}
.hotspot{position:absolute;z-index:20;display:block;cursor:pointer;background:rgba(255,255,255,.001);border-radius:7px;text-decoration:none;touch-action:manipulation}
.hotspot:hover{outline:2px solid rgba(237,169,26,.4);background:rgba(237,169,26,.04)}
.hotspot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.logo{left:.5%;top:.5%;width:27.5%;height:11.5%}
.home{left:29.5%;top:2.2%;width:5.6%;height:9%}
.markets{left:35%;top:2.2%;width:11.8%;height:9%}
.sell{left:46.8%;top:2.2%;width:9.2%;height:9%}
.financing{left:56.1%;top:2.2%;width:7%;height:9%}
.resources{left:63.2%;top:2.2%;width:8.9%;height:9%}
.about{left:72.2%;top:2.2%;width:7.1%;height:9%}
.contact{left:79.4%;top:2.2%;width:6.8%;height:9%}
.login{left:86.3%;top:1.6%;width:12%;height:9.5%}
.browse-cta{left:1.8%;top:69.3%;width:17.7%;height:10.5%}
.list-cta{left:20.7%;top:69.3%;width:15.8%;height:10.5%}
@media(max-width:700px){.hotspot{border-radius:3px}.hero-tail{height:36px}}
</style>
</head>
<body>
<main class="hero-wrap">
<section class="hero">
<img src="/hero.webp" alt="Liquor License Market — The Nation's Marketplace for Liquor Licenses">
<a class="hotspot logo" href="/" aria-label="Home"></a>
<a class="hotspot home" href="/" aria-label="Home"></a>
<a class="hotspot markets" href="/browse-markets.html" aria-label="Browse Markets"></a>
<a class="hotspot sell" href="/sell-license.html" aria-label="Sell a License"></a>
<a class="hotspot financing" href="/financing.html" aria-label="Financing"></a>
<a class="hotspot resources" href="/resources.html" aria-label="Resources"></a>
<a class="hotspot about" href="/about.html" aria-label="About Us"></a>
<a class="hotspot contact" href="/contact.html" aria-label="Contact"></a>
<a class="hotspot login" href="/client-login.html" aria-label="Client Login"></a>
<a class="hotspot browse-cta" href="/browse-markets.html" aria-label="Browse Markets"></a>
<a class="hotspot list-cta" href="/sell-license.html" aria-label="List a License"></a>
</section>
<div class="hero-tail" aria-hidden="true"></div>
</main>
</body>
</html>
