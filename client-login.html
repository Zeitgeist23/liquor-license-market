<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Secure client access for Liquor License Market.">
  <title>Client Login | Liquor License Market</title>
  <style>
    :root{--navy:#071d33;--navy-2:#0d2946;--gold:#eda91a;--ivory:#f7f3ea;--muted:#c7d0da}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 18%,rgba(237,169,26,.08),transparent 27%),var(--navy);color:var(--ivory);font-family:Arial,Helvetica,sans-serif}
    .site-header{height:104px;border-bottom:1px solid rgba(237,169,26,.55);background:#031528;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,4vw,70px)}
    .brand{display:flex;align-items:center;gap:18px;color:var(--ivory);text-decoration:none}
    .monogram{color:var(--gold);font:600 42px/1 Georgia,"Times New Roman",serif;letter-spacing:-4px}
    .brand-copy strong{display:block;font:600 25px/1.1 Georgia,"Times New Roman",serif}
    .brand-copy span{display:block;margin-top:7px;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:3px}
    .home-link{color:var(--ivory);font-weight:700;text-decoration:none;transition:color .2s ease,transform .2s ease}
    .home-link:hover{color:var(--gold);transform:translateY(-2px)}
    .page{min-height:calc(100vh - 104px);display:grid;grid-template-columns:minmax(280px,510px) minmax(320px,520px);gap:clamp(42px,7vw,110px);align-items:center;justify-content:center;padding:64px 28px 76px}
    .intro .eyebrow,.llm-account-welcome .eyebrow{color:var(--gold);font-size:13px;font-weight:900;letter-spacing:3px}
    .intro h1,.llm-account-welcome h1{margin:16px 0 22px;font:600 clamp(48px,6vw,78px)/.98 Georgia,"Times New Roman",serif}
    .intro h1 span{color:var(--gold)}
    .intro p{max-width:510px;margin:0;color:var(--muted);font-size:20px;line-height:1.65}
    .trust-row{display:flex;gap:24px;margin-top:36px;color:var(--ivory);font-size:14px;font-weight:700}
    .trust-row span:before{content:"";display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(237,169,26,.75)}
    .auth-panel{min-height:520px;display:flex;align-items:center;justify-content:center;padding:24px;border:1px solid rgba(237,169,26,.52);border-radius:18px;background:rgba(3,21,40,.62);box-shadow:0 28px 85px rgba(0,0,0,.34)}
    [data-clerk-auth-mount]{width:100%;display:flex;justify-content:center}
    [data-clerk-auth-loading]{color:var(--muted);font-size:17px;text-align:center}
    .llm-account-welcome{text-align:center;padding:42px 28px}
    .llm-account-welcome h1{font-size:48px}
    .llm-account-welcome p{color:var(--muted);font-size:18px}
    .llm-account-button{margin-top:18px;padding:15px 24px;border:0;border-radius:9px;background:var(--gold);color:#05172a;font-weight:900;font-size:16px;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}
    .llm-account-button:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(237,169,26,.28)}
    @media(max-width:850px){
      .site-header{height:88px;padding:0 20px}.brand-copy span{display:none}.brand-copy strong{font-size:20px}
      .page{grid-template-columns:1fr;padding-top:46px}.intro{text-align:center}.intro p{margin-inline:auto}.trust-row{justify-content:center;flex-wrap:wrap}.auth-panel{min-height:480px}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Liquor License Market home">
      <span class="monogram" aria-hidden="true">LLM</span>
      <span class="brand-copy"><strong>Liquor License Market</strong><span>NATIONAL MARKETPLACE</span></span>
    </a>
    <a class="home-link" href="/">Back to Home</a>
  </header>
  <main class="page">
    <section class="intro">
      <p class="eyebrow">SECURE CLIENT PORTAL</p>
      <h1>Your market.<br><span>Your account.</span></h1>
      <p>Sign in to manage your Liquor License Market account, or create an account to begin using secure client services.</p>
      <div class="trust-row"><span>Secure access</span><span>Private account</span><span>Easy sign-up</span></div>
    </section>
    <section class="auth-panel" aria-label="Client sign in">
      <p data-clerk-auth-loading>Loading secure account access…</p>
      <div data-clerk-auth-mount></div>
    </section>
  </main>
  <script src="/clerk-auth.js" defer></script>
</body>
</html>
