<style>
:root{--navy:#071d33;--hero:#071d33;--light:#0f243f;--gold:#eda91a;--white:#f6f3ed;--header:#021528}
*{box-sizing:border-box}
html{margin:0;width:100%;min-height:100%;background:var(--navy)}
body{margin:0;width:100%;min-height:100vh;background:var(--navy);color:var(--white);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
.hero-wrap{width:100%;background:var(--light)}
.hero{position:relative;width:100vw;max-width:none;margin:0;aspect-ratio:1400/729;overflow:hidden;background:var(--hero)}
.hero>img.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;user-select:none}
.hero-tail{height:64px;width:100%;background:var(--light)}
.logo-mask{position:absolute;z-index:12;left:0;top:0;width:29.5%;height:13%;background:var(--header);pointer-events:none}
.logo-art{position:absolute;z-index:13;left:1.5%;top:1.2%;width:19.62%;height:auto;display:block;pointer-events:none;user-select:none}
.hotspot{position:absolute;z-index:20;display:block;cursor:pointer;background:rgba(255,255,255,.001);border-radius:7px;text-decoration:none;touch-action:manipulation}
.hotspot:hover{outline:2px solid rgba(237,169,26,.4);background:rgba(237,169,26,.04)}
.hotspot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.logo{left:1.5%;top:1.2%;width:19.62%;height:10.2%}
.home{left:29.5%;top:2.2%;width:5.6%;height:9%}
.markets{left:35%;top:2.2%;width:11.8%;height:9%;border:0;padding:0;appearance:none}
.sell{left:46.8%;top:2.2%;width:9.2%;height:9%}
.financing{left:56.1%;top:2.2%;width:7%;height:9%}
.resources{left:63.2%;top:2.2%;width:8.9%;height:9%}
.about{left:72.2%;top:2.2%;width:7.1%;height:9%}
.contact{left:79.4%;top:2.2%;width:6.8%;height:9%}
.login{left:86.3%;top:1.6%;width:12%;height:9.5%}
.browse-cta{left:1.8%;top:69.3%;width:17.7%;height:10.5%}
.list-cta{left:20.7%;top:69.3%;width:15.8%;height:10.5%}
.market-menu{position:absolute;z-index:40;left:35%;top:11.2%;width:24%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.25vw;padding:.45vw;background:rgba(5,24,43,.98);border:1px solid var(--gold);border-radius:.65vw;box-shadow:0 .8vw 2vw rgba(0,0,0,.45)}
.market-menu[hidden]{display:none}
.market-menu a{display:block;padding:.45vw .8vw;color:var(--white);font-size:clamp(7px,1vw,15px);font-weight:600;line-height:1.15;text-decoration:none;border:1px solid rgba(237,169,26,.3);border-radius:.35vw;background:rgba(15,36,63,.95)}
.market-menu a:hover,.market-menu a:focus-visible{color:#071d33;background:var(--gold);outline:none}
.state-overlay{position:absolute;inset:0;z-index:15;width:100%;height:100%;pointer-events:none}
.map-state{pointer-events:all;cursor:pointer;outline:none}
.state-shape{fill:rgba(255,255,255,0);stroke:transparent;stroke-width:2;transition:fill .15s ease}
.state-label{fill:#050505;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:900;letter-spacing:1px;text-anchor:middle;dominant-baseline:middle;opacity:0;pointer-events:none;transition:opacity .15s ease}
.state-label.small{font-size:11px;letter-spacing:0}
.map-state:hover .state-shape,.map-state:focus-visible .state-shape{fill:rgba(255,255,255,.08)}
.map-state:hover .state-label,.map-state:focus-visible .state-label{opacity:1}
@media(max-width:700px){.hotspot{border-radius:3px}.hero-tail{height:36px}}
