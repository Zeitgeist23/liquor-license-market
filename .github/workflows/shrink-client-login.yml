name: Shrink Client Login button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  shrink-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reduce Client Login visual size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          replacements = {
              'transform:scale(.88);clip-path:polygon(86.3% 1.6%,98.3% 1.6%,98.3% 11.1%,86.3% 11.1%)':
              'transform:scale(.81);clip-path:polygon(86.3% 1.6%,98.3% 1.6%,98.3% 11.1%,86.3% 11.1%)',
              'img.login-scaled{transform:scale(.968)}':
              'img.login-scaled{transform:scale(.891)}',
          }
          changed = False
          for old, new in replacements.items():
              if old in html:
                  html = html.replace(old, new, 1)
                  changed = True
          if not changed:
              raise SystemExit('Client Login scale patterns not found or already changed')
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit size adjustment
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Client Login already resized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Shrink Client Login button by about 8 percent"
          git push origin HEAD:main
