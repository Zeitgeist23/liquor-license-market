name: Fix California fast-load declaration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-california-fastload-declaration.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix duplicate declarations and make patchers idempotent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Fix the live California page immediately.
          page = Path('california/licenses-for-sale/index.html')
          html = page.read_text(encoding='utf-8')
          html, n = re.subn(
              r"let records=\[\];let sourceMeta=\[\];let visible=60;[^\n]*",
              "let records=[];let sourceMeta=[];let visible=60;let marketStats={};let govRowsCache=[];let fullMarketReady=false;let fullLoadPromise=null;let filtersPopulated=false;",
              html,
              count=1,
          )
          if n != 1:
              raise SystemExit('California declaration not found')
          page.write_text(html, encoding='utf-8')

          # Make duplicate-aware UI patcher safe to run repeatedly.
          dedupe = Path('tools/apply_dedupe_ui.py')
          text = dedupe.read_text(encoding='utf-8')
          old = '    text = text.replace("let records=[];let sourceMeta=[];let visible=60;", "let records=[];let sourceMeta=[];let visible=60;let marketStats={};", 1)'
          new = '''    text = re.sub(\n        r"let records=\\[\\];let sourceMeta=\\[\\];let visible=60;(?:let marketStats=\\{\\};)*",\n        "let records=[];let sourceMeta=[];let visible=60;let marketStats={};",\n        text,\n        count=1,\n    )'''
          if old in text:
              text = text.replace(old, new, 1)
          dedupe.write_text(text, encoding='utf-8')

          # Make fast-load patcher replace the whole state declaration line every run.
          fast = Path('tools/apply_california_fastload.py')
          text = fast.read_text(encoding='utf-8')
          start = text.find('    text = re.sub(\n        r"let records=\\[\\];let sourceMeta=\\[\\];let visible=60;')
          end = text.find('\n\n    start = text.find("Promise.all([fetch(CDTFA_URL")', start)
          if start < 0 or end < 0:
              raise SystemExit('Fast-load declaration patch block not found')
          replacement = '''    text = re.sub(\n        r"let records=\\[\\];let sourceMeta=\\[\\];let visible=60;[^\\n]*",\n        "let records=[];let sourceMeta=[];let visible=60;let marketStats={};let govRowsCache=[];let fullMarketReady=false;let fullLoadPromise=null;let filtersPopulated=false;",\n        text,\n        count=1,\n    )'''
          text = text[:start] + replacement + text[end:]
          fast.write_text(text, encoding='utf-8')
          PY
      - name: Commit California fast-load repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add california/licenses-for-sale/index.html tools/apply_dedupe_ui.py tools/apply_california_fastload.py
          git commit -m "Fix California inventory fast-load JavaScript"
          git push origin HEAD:main
