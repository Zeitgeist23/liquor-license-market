name: Sync California CDTFA inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-california-cdtfa.yml'
      - 'tools/update_california_inventory.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Refresh CDTFA inventory
        run: python tools/update_california_inventory.py
      - name: Commit inventory changes
        shell: bash
        run: |
          if git diff --quiet -- data/california-cdtfa.json; then
            echo "No CDTFA inventory changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/california-cdtfa.json
          git commit -m "Refresh California CDTFA auction inventory"
          git push origin HEAD:main
