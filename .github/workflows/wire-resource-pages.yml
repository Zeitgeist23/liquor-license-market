name: Wire resource pages
on:
  push:
    paths:
      - '.github/workflows/wire-resource-pages.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Resources dropdown links
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
              '/resources.html#liquor-license-101': '/liquor-license-101.html',
              '/resources.html#license-types-by-state': '/license-types-by-state.html',
              '/resources.html#quota-vs-non-quota': '/quota-vs-non-quota.html',
              '/resources.html#buying-a-license': '/buying-a-license.html',
              '/resources.html#selling-a-license': '/selling-a-license.html',
              '/resources.html#transfer-and-escrow': '/transfer-and-escrow.html',
              '/resources.html#faqs': '/faqs.html',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected link: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Remove temporary workflow
        run: rm .github/workflows/wire-resource-pages.yml
      - name: Commit and push
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add index.html .github/workflows/wire-resource-pages.yml
          git commit -m "Wire Resources dropdown to dedicated pages"
          git push