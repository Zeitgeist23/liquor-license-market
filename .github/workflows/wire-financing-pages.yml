name: Wire financing pages
on:
  push:
    paths:
      - '.github/workflows/wire-financing-pages.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Financing dropdown links
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements={
            '/financing.html#how-financing-works':'/how-financing-works.html',
            '/financing.html#borrow-to-buy-a-license':'/borrow-to-buy-a-license.html',
            '/financing.html#refinance-a-license':'/refinance-a-license.html',
            '/financing.html#get-pre-qualified':'/get-pre-qualified.html',
            '/financing.html#lend-against-a-license':'/lend-against-a-license.html',
            '/financing.html#lender-opportunities':'/lender-opportunities.html',
            '/financing.html#become-a-lender':'/become-a-lender.html',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected link: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/wire-financing-pages.yml
      - name: Commit and push
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add index.html .github/workflows/wire-financing-pages.yml
          git commit -m "Wire Financing dropdown to dedicated pages"
          git push
