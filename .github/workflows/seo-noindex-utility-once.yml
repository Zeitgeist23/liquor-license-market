name: Noindex utility and duplicate pages once

on:
  push:
    paths:
      - '.github/workflows/seo-noindex-utility-once.yml'

permissions:
  contents: write

jobs:
  noindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add noindex to non-public pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              'client-login.html',
              'home.html',
              'home-clean.html',
              'home-final.html',
              'home-logo10.html',
              'home-nologo.html',
              'home-separated.html',
          ]
          changed = []
          for name in targets:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              tag = '<meta name="robots" content="noindex,nofollow">'
              if re.search(r'<meta\s+[^>]*name=["\']robots["\'][^>]*>', s, flags=re.I):
                  ns = re.sub(r'<meta\s+[^>]*name=["\']robots["\'][^>]*>', tag, s, count=1, flags=re.I)
              else:
                  if '</head>' not in s:
                      continue
                  ns = s.replace('</head>', tag + '\n</head>', 1)
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(name)
          if not changed:
              raise SystemExit('No noindex changes were needed')
          print('Noindexed:', ', '.join(changed))
          PY
      - name: Commit noindex directives
        shell: bash
        run: |
          git config user.name "LLM Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add client-login.html home*.html
          git commit -m "Noindex login and duplicate homepage variants"
          git push origin HEAD:main
