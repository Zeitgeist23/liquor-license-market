name: Fix homepage monogram inline

on:
  push:
    paths:
      - '.github/workflows/fix-home-monogram-inline.yml'

permissions:
  contents: write

jobs:
  fix-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inline approved monogram artwork in homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          svg = Path('assets/home-monogram-exact.svg').read_text(encoding='utf-8')
          m = re.search(r'href="data:image/jpeg;base64,([^"]+)"', svg)
          if not m:
              raise SystemExit('Approved monogram image data not found')
          data = m.group(1)

          old_img = re.search(r'<img class="hero-llm-attached"[^>]*>', s)
          if not old_img:
              raise SystemExit('Homepage monogram image tag not found')
          new_img = f'<img class="hero-llm-attached" src="data:image/jpeg;base64,{data}" alt="LLM">'
          s = s[:old_img.start()] + new_img + s[old_img.end():]

          old_css = '.hero img.hero-llm-attached{position:absolute;inset:auto;left:3.8%;top:18.7%;width:27%;height:auto;object-fit:contain;z-index:15;display:block;pointer-events:none;user-select:none}'
          new_css = '.hero img.hero-llm-attached{position:absolute!important;inset:auto!important;left:3.8%!important;top:18.7%!important;width:27%!important;height:auto!important;object-fit:contain!important;z-index:30!important;display:block!important;pointer-events:none;user-select:none}'
          if old_css in s:
              s = s.replace(old_css, new_css, 1)
          elif new_css not in s:
              raise SystemExit('Expected homepage monogram CSS not found')

          index.write_text(s, encoding='utf-8')
          PY
      - name: Commit live homepage fix
        shell: bash
        run: |
          git config user.name "LLM Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Inline approved homepage monogram artwork"
          git push origin HEAD:main
