name: Enlarge county count
on:
  push:
    branches: [main]
jobs:
  update:
    if: github.event.head_commit.message == 'Add one-time county count enlargement workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge and silver county count
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.market-detail-count{color:#bfcfe0;font-size:clamp(7px,.72vw,11px);white-space:nowrap}'
          new='.market-detail-count{color:#c0c7d1;font-size:clamp(14px,1.22vw,20px);font-weight:600;white-space:nowrap}'
          if old not in s:
              raise SystemExit('target CSS not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/enlarge-county-count.yml
      - name: Commit and push
        run: |
          git config user.name Zeitgeist23
          git config user.email JWigg023@gmail.com
          git add index.html .github/workflows/enlarge-county-count.yml
          git commit -m "Enlarge and silver county count text"
          git push
