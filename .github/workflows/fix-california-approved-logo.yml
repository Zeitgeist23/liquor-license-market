name: Fix California approved LLM logo

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-california-approved-logo.yml'

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace California substitute logo with approved LLM artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = list(Path('california').rglob('*.html'))
          if not pages:
              raise SystemExit('No California HTML pages found')

          old_css = ".brand{display:flex;align-items:center;gap:14px;color:var(--white);text-decoration:none}.brandmark{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:9px;color:var(--gold);font:700 18px Georgia,serif}.brandtext strong{display:block;font:400 22px Georgia,serif}.brandtext small{display:block;margin-top:3px;color:var(--gold);font-size:10px;letter-spacing:.16em;text-transform:uppercase}"
          new_css = ".brand{display:block;width:clamp(255px,20.5vw,350px);aspect-ratio:5.08585;overflow:hidden;position:relative;color:var(--white);text-decoration:none;flex:0 0 auto}.brand-approved{position:absolute;inset:0;display:block;overflow:hidden}.brand-approved img{position:absolute;left:0;top:-3.382%;width:350.877%;height:966.184%;max-width:none;object-fit:fill;pointer-events:none;user-select:none}"

          old_mobile = ".brandtext strong{font-size:18px}.brandmark{width:36px;height:36px}"
          new_mobile = ".brand{width:255px}"

          old_html = '<a class="brand" href="/"><span class="brandmark">LLM</span><span class="brandtext"><strong>Liquor License Market</strong><small>National Marketplace</small></span></a>'
          new_html = '<a class="brand" href="/" aria-label="Liquor License Market home"><span class="brand-approved"><img src="/hero-tilted.webp" alt="Liquor License Market — National Marketplace"></span></a>'

          changed = []
          for path in pages:
              html = path.read_text(encoding='utf-8')
              original = html
              html = html.replace(old_css, new_css)
              html = html.replace(old_mobile, new_mobile)
              html = html.replace(old_html, new_html)
              if html != original:
                  path.write_text(html, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No California substitute-logo markup found')
          print('Corrected approved LLM logo on:')
          for item in changed:
              print(' -', item)
          PY
      - name: Commit California logo correction
        shell: bash
        run: |
          if git diff --quiet -- california; then
            echo "No California logo changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add california
          git commit -m "Use approved LLM logo on California pages"
          git push origin HEAD:main
