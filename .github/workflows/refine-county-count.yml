name: Refine county count
on:
  push:
    paths:
      - '.github/workflows/refine-county-count.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine county count text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_css = '.market-detail-count{color:#c0c7d1;font-size:clamp(14px,1.22vw,20px);font-weight:600;white-space:nowrap}'
          new_css = '.market-detail-count{color:#fff;font-size:clamp(12px,1.05vw,17px);font-weight:400;white-space:nowrap}'
          if old_css not in s:
              raise SystemExit('Expected county-count CSS not found')
          s = s.replace(old_css, new_css, 1)
          s = s.replace("+' counties'", "+' COUNTIES'")
          s = s.replace("+' of '+data.counties.length+' counties'", "+' of '+data.counties.length+' COUNTIES'")
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/refine-county-count.yml
      - name: Commit and push
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add index.html .github/workflows/refine-county-count.yml
          git commit -m "Refine county count text styling"
          git push
