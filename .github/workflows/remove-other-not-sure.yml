name: Remove other not sure license options
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-other-not-sure.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Other / not sure from state menus
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = ',"Other / not sure"'
          count = s.count(old)
          if not count:
              raise SystemExit('No Other / not sure options found')
          s = s.replace(old, '')
          p.write_text(s)
          print(f'Removed {count} options')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/remove-other-not-sure.yml
      - name: Commit and push cleanup
        run: |
          git config user.name 'Zeitgeist23'
          git config user.email 'JWigg023@gmail.com'
          git add index.html .github/workflows/remove-other-not-sure.yml
          git commit -m 'Remove Other not sure license options from state menus'
          git push
