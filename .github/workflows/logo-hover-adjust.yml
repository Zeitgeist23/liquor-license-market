name: Adjust header logo hover
on:
  push:
    paths:
      - '.github/workflows/logo-hover-adjust.yml'
permissions:
  contents: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust header logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '.hero img.logo-shifted{z-index:17;left:18px;top:11px;right:auto;bottom:auto;transform-origin:0 0;transform:scale(.78);clip-path:polygon(0 .35%,28.5% .35%,28.5% 10.7%,0 10.7%)}'
          new = '.hero img.logo-shifted{z-index:17;left:18px;top:12px;right:auto;bottom:auto;transform-origin:0 0;transform:scale(.78);clip-path:polygon(0 .35%,28.5% .35%,28.5% 10.7%,0 10.7%);transition:transform .16s cubic-bezier(.2,.8,.2,1)}'
          if old not in s:
              raise SystemExit('logo-shifted rule not found')
          s = s.replace(old, new, 1)
          anchor = '.login:hover,.login:focus-visible{outline:none;background:transparent}\n.hero:has(.login:hover) img.login-scaled,.hero:has(.login:focus-visible) img.login-scaled{transform:scale(.968)}'
          repl = '.logo:hover,.logo:focus-visible{outline:none!important;background:transparent!important}\n.hero:has(.logo:hover) img.logo-shifted,.hero:has(.logo:focus-visible) img.logo-shifted{transform:scale(.936)}\n' + anchor
          if anchor not in s:
              raise SystemExit('hover anchor not found')
          s = s.replace(anchor, repl, 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/logo-hover-adjust.yml
      - name: Commit and push
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add index.html .github/workflows/logo-hover-adjust.yml
          git commit -m "Move header logo down and enlarge on hover"
          git push
