name: Fix dedupe UI idempotency

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-dedupe-ui-idempotency.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make California UI patch idempotent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_dedupe_ui.py')
          text = p.read_text(encoding='utf-8')
          old = '    text = text.replace("records=[...govRows,...marketRows];sourceMeta=market.sources||[];", "records=[...govRows,...marketRows];sourceMeta=market.sources||[];marketStats=market||{};", 1)'
          new = '''    text = re.sub(\n        r"records=\\[\\.\\.\\.govRows,\\.\\.\\.marketRows\\];sourceMeta=market\\.sources\\|\\|\\[\\];(?:marketStats=market\\|\\|\\{\\};)*",\n        "records=[...govRows,...marketRows];sourceMeta=market.sources||[];marketStats=market||{};",\n        text,\n        count=1,\n    )'''
          if old not in text:
              raise SystemExit('target line not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit idempotency fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/apply_dedupe_ui.py
          git commit -m "Make dedupe UI patch idempotent"
          git push origin HEAD:main
