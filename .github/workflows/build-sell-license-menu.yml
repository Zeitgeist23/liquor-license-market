name: Build Sell A License menu

on:
  push:
    branches:
      - feature/sell-license-menu

permissions:
  contents: write

jobs:
  build-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sell-license-menu
          fetch-depth: 0
      - name: Build dropdown into homepage
        run: python tools/patch_sell_menu.py
      - name: Commit built menu
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sell menu already built"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build Sell A License dropdown menu"
          git push origin HEAD:feature/sell-license-menu
