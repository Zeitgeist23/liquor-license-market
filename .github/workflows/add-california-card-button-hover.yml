name: Add California listing hover effects

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-california-card-button-hover.yml'

permissions:
  contents: write

jobs:
  hover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add hover effects to California inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('california/licenses-for-sale/index.html')
          s=p.read_text(encoding='utf-8')
          old='.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#0c2947 0%,#081d33 100%);box-shadow:0 13px 30px rgba(0,0,0,.17);display:flex;flex-direction:column}'
          new='.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#0c2947 0%,#081d33 100%);box-shadow:0 13px 30px rgba(0,0,0,.17);display:flex;flex-direction:column;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease}.card:hover{transform:translateY(-6px);border-color:rgba(237,169,26,.72);box-shadow:0 20px 42px rgba(0,0,0,.3),0 0 0 1px rgba(237,169,26,.16),0 0 24px rgba(237,169,26,.12);background:linear-gradient(180deg,#103252 0%,#0a223b 100%)}'
          if old not in s:
              raise SystemExit('Card CSS target not found')
          s=s.replace(old,new,1)
          old2='.btn{display:flex;align-items:center;justify-content:center;min-height:41px;padding:10px 12px;border-radius:8px;text-decoration:none;text-align:center;font-size:11px;font-weight:800}.btn-primary{background:var(--gold);color:#071d33}.btn-secondary{border:1px solid rgba(237,169,26,.44);color:#ffd06b;background:#071d33}'
          new2='.btn{display:flex;align-items:center;justify-content:center;min-height:41px;padding:10px 12px;border-radius:8px;text-decoration:none;text-align:center;font-size:11px;font-weight:800;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,color .16s ease,border-color .16s ease}.btn:hover,.btn:focus-visible{transform:translateY(-2px);outline:none}.btn-primary{background:var(--gold);color:#071d33}.btn-primary:hover,.btn-primary:focus-visible{background:var(--gold2);box-shadow:0 7px 18px rgba(237,169,26,.28)}.btn-secondary{border:1px solid rgba(237,169,26,.44);color:#ffd06b;background:#071d33}.btn-secondary:hover,.btn-secondary:focus-visible{border-color:var(--gold);background:#0d2947;color:#fff1c4;box-shadow:0 7px 18px rgba(0,0,0,.2)}'
          if old2 not in s:
              raise SystemExit('Button CSS target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit hover effects
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add california/licenses-for-sale/index.html
          git commit -m 'Add hover effects to California listing cards and buttons'
          git push origin HEAD:main
