name: Split Florida license buttons
on:
  push:
    paths:
      - '.github/workflows/split-florida-license-buttons.yml'
permissions:
  contents: write
jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Split Florida license buttons
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '"types":["4COP/3PS","5COP/3APS","6COP/3BPS","7COP/3CPS","8COP/3DPS"]'
          new = '"types":["4COP","3PS","5COP","3APS","6COP","3BPS","7COP","3CPS","8COP","3DPS"]'
          if old not in text:
              raise SystemExit('Expected Florida license type list not found')
          text = text.replace(old, new, 1)
          old_css = '.license-type-list{display:flex;flex-wrap:wrap;gap:.28vw;max-height:5.1vw;overflow-y:auto;padding-right:.18vw}'
          new_css = '.license-type-list{display:flex;flex-wrap:wrap;gap:.38vw .42vw;max-height:6.4vw;overflow-y:auto;padding-right:.18vw}'
          if old_css in text:
              text = text.replace(old_css, new_css, 1)
          path.write_text(text, encoding='utf-8')
      - name: Remove temporary workflow
        run: rm .github/workflows/split-florida-license-buttons.yml
      - name: Commit and push
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add index.html .github/workflows/split-florida-license-buttons.yml
          git commit -m "Split Florida license types into separate buttons"
          git push
