name: Add Resources dropdown
on:
  push:
    paths:
      - '.github/workflows/add-resources-dropdown.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Resources dropdown
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          css_marker = ".market-menu a:hover::after,.market-menu a:focus-visible::after,.market-menu a.is-active::after{color:#071d33}\n"
          css = css_marker + ".resources-menu{position:absolute;z-index:42;left:63.2%;top:11.2%;width:19.5%;display:flex;flex-direction:column;gap:.22vw;padding:.45vw;background:rgba(5,24,43,.98);border:1px solid var(--gold);border-radius:.65vw;box-shadow:0 .8vw 2vw rgba(0,0,0,.45)}\n.resources-menu[hidden]{display:none}\n.resources-menu a{display:flex;align-items:center;padding:.5vw .8vw;color:var(--white);font-size:clamp(7px,.92vw,14px);font-weight:600;line-height:1.15;text-decoration:none;border:1px solid rgba(237,169,26,.3);border-radius:.35vw;background:rgba(15,36,63,.95);transition:color .14s ease,background .14s ease,box-shadow .14s ease}\n.resources-menu a:hover,.resources-menu a:focus-visible{color:#071d33;background:var(--gold);outline:none;box-shadow:0 0 .55vw rgba(237,169,26,.35)}\n@media(max-width:700px){.resources-menu{left:58%;top:10.8%;width:38%;padding:.55vw}}\n"
          if '.resources-menu{' not in s:
              if css_marker not in s:
                  raise SystemExit('CSS marker not found')
              s = s.replace(css_marker, css, 1)

          old = '<a class="hotspot header-menu-item resources" href="/resources.html" aria-label="Resources"><span>Resources <b class="markets-caret" aria-hidden="true">⌄</b></span></a>'
          new = '''<a class="hotspot header-menu-item resources" id="header-resources-toggle" href="/resources.html" aria-label="Resources" aria-haspopup="menu" aria-expanded="false" aria-controls="resources-menu"><span>Resources <b class="markets-caret" aria-hidden="true">⌄</b></span></a>\n<nav class="resources-menu" id="resources-menu" aria-label="Liquor license resources" hidden>\n<a href="/resources.html#liquor-license-101">Liquor License 101</a>\n<a href="/resources.html#license-types-by-state">License Types by State</a>\n<a href="/resources.html#quota-vs-non-quota">Quota vs. Non-Quota States</a>\n<a href="/resources.html#buying-a-license">Buying a License</a>\n<a href="/resources.html#selling-a-license">Selling a License</a>\n<a href="/resources.html#transfer-and-escrow">Transfer &amp; Escrow</a>\n<a href="/resources.html#faqs">FAQs</a>\n</nav>'''
          if 'id="resources-menu"' not in s:
              if old not in s:
                  raise SystemExit('Resources nav marker not found')
              s = s.replace(old, new, 1)

          js = '''\n<script>\n(()=>{\n const toggle=document.getElementById('header-resources-toggle');\n const menu=document.getElementById('resources-menu');\n if(!toggle||!menu)return;\n let timer;\n const open=()=>{clearTimeout(timer);menu.hidden=false;toggle.setAttribute('aria-expanded','true')};\n const close=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(!toggle.matches(':hover')&&!menu.matches(':hover')&&!toggle.matches(':focus')&&!menu.matches(':focus-within')){menu.hidden=true;toggle.setAttribute('aria-expanded','false')}},160)};\n toggle.addEventListener('pointerenter',open);\n toggle.addEventListener('pointerleave',close);\n toggle.addEventListener('focus',open);\n menu.addEventListener('pointerenter',open);\n menu.addEventListener('pointerleave',close);\n menu.addEventListener('focusin',open);\n menu.addEventListener('focusout',close);\n document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.hidden=true;toggle.setAttribute('aria-expanded','false')}});\n})();\n</script>\n'''
          if "const toggle=document.getElementById('header-resources-toggle')" not in s:
              if '</body>' not in s:
                  raise SystemExit('body close not found')
              s = s.replace('</body>', js + '</body>', 1)

          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/add-resources-dropdown.yml
      - name: Commit and push
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add index.html .github/workflows/add-resources-dropdown.yml
          git commit -m "Add Resources dropdown to homepage header"
          git push