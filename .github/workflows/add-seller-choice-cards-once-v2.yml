name: Add seller listing choices v2

on:
  push:
    paths:
      - '.github/workflows/add-seller-choice-cards-once-v2.yml'

permissions:
  contents: write

jobs:
  update-seller-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch seller page
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit seller choice screen
        shell: bash
        run: |
          git config user.name "LLM Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add sell-license.html
          git commit -m "Offer free self-listing or broker help on seller page"
          git push origin HEAD:main
