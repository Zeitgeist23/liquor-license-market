name: Add broker assistance links

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-broker-assistance-links.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add broker assistance entry points
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Homepage hero menus.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if '/brokers/?intent=sell' not in text:
              needle = '<a href="/seller-options.html"><span>Seller Options</span></a>'
              text = text.replace(needle, needle + '\n<a href="/brokers/?intent=sell"><span>Hire a Liquor License Broker</span></a>', 1)
          if '<a href="/brokers/">Find a Broker</a>' not in text:
              needle = '<a href="/transfer-and-escrow.html">Transfer &amp; Escrow</a>'
              text = text.replace(needle, needle + '\n<a href="/brokers/">Find a Broker</a>', 1)
          p.write_text(text, encoding='utf-8')

          # Add the broker options to the standard hover menus used on interior pages.
          for p in Path('.').glob('*.html'):
              if p.name == 'index.html':
                  continue
              text = p.read_text(encoding='utf-8')
              changed = False
              if 'aria-label="Sell a License pages"' in text and '/brokers/?intent=sell' not in text:
                  needle = '<a href="/sell-license.html">List Your License</a>'
                  if needle in text:
                      text = text.replace(needle, needle + '\n<a href="/brokers/?intent=sell">Hire a Liquor License Broker</a>', 1)
                      changed = True
              if 'aria-label="Resource pages"' in text and '<a href="/brokers/">Find a Broker</a>' not in text:
                  needle = '<a href="/selling-a-license.html">Selling a License</a>'
                  if needle in text:
                      text = text.replace(needle, needle + '\n<a href="/brokers/">Find a Broker</a>', 1)
                      changed = True
              if changed:
                  p.write_text(text, encoding='utf-8')

          # California inventory: two clear optional broker-assistance CTAs.
          p = Path('california/licenses-for-sale/index.html')
          text = p.read_text(encoding='utf-8')
          if '.broker-cta{' not in text:
              css = '''.broker-cta{max-width:1240px;margin:0 auto 24px;padding:0 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.broker-help{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:17px 19px;border:1px solid rgba(237,169,26,.45);border-radius:11px;background:linear-gradient(145deg,rgba(13,41,71,.96),rgba(6,26,46,.96));color:#f6f3ed;text-decoration:none;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.broker-help:hover,.broker-help:focus-visible{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 12px 28px rgba(0,0,0,.24),0 0 18px rgba(237,169,26,.1);outline:none}.broker-help strong{display:block;font-size:13px;color:#fff}.broker-help span{display:block;margin-top:4px;color:#9fb4c8;font-size:11px;line-height:1.35}.broker-help b{flex:0 0 auto;color:var(--gold);font-size:12px;letter-spacing:.03em}.broker-help:hover b{color:var(--gold2)}@media(max-width:760px){.broker-cta{grid-template-columns:1fr}}'''
              text = text.replace('.toolbar{', css + '.toolbar{', 1)
          if 'REQUEST BUYER BROKER HELP' not in text:
              block = '''<section class="broker-cta" aria-label="Optional broker assistance"><a class="broker-help" href="/california/liquor-license-brokers/?intent=buy"><div><strong>Need help buying a California license?</strong><span>Ask LLM to connect you with an independent liquor-license broker.</span></div><b>REQUEST BUYER BROKER HELP →</b></a><a class="broker-help" href="/california/liquor-license-brokers/?intent=sell"><div><strong>Selling a California liquor license?</strong><span>Request valuation, marketing, negotiation, and transaction assistance.</span></div><b>HIRE A BROKER →</b></a></section>'''
              text = text.replace('<div class="toolbar">', block + '\n<div class="toolbar">', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit broker assistance wiring
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- '*.html' california/licenses-for-sale/index.html)" ]; then
            echo "No broker link changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' california/licenses-for-sale/index.html
          git commit -m "Add buyer and seller broker assistance entry points"
          git push origin HEAD:main
