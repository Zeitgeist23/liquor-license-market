name: Add Financing dropdown
on:
  push:
    paths:
      - '.github/workflows/add-financing-dropdown.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Financing dropdown
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_css='''@media(max-width:700px){.resources-menu{left:58%;top:10.8%;width:38%;padding:.55vw}}'''
          new_css='''@media(max-width:700px){.resources-menu{left:58%;top:10.8%;width:38%;padding:.55vw}}\n.financing-menu{position:absolute;z-index:43;left:55.3%;top:11.2%;width:20.5%;display:flex;flex-direction:column;gap:.22vw;padding:.45vw;background:rgba(5,24,43,.98);border:1px solid var(--gold);border-radius:.65vw;box-shadow:0 .8vw 2vw rgba(0,0,0,.45)}\n.financing-menu[hidden]{display:none}\n.financing-menu a{display:flex;align-items:center;padding:.5vw .8vw;color:var(--white);font-size:clamp(7px,.92vw,14px);font-weight:600;line-height:1.15;text-decoration:none;border:1px solid rgba(237,169,26,.3);border-radius:.35vw;background:rgba(15,36,63,.95);transition:color .14s ease,background .14s ease,box-shadow .14s ease}\n.financing-menu a:hover,.financing-menu a:focus-visible{color:#071d33;background:var(--gold);outline:none;box-shadow:0 0 .55vw rgba(237,169,26,.35)}\n@media(max-width:700px){.financing-menu{left:50%;top:10.8%;width:42%;padding:.55vw}}'''
          if old_css not in s:
              raise SystemExit('resources menu CSS marker not found')
          s=s.replace(old_css,new_css,1)
          old_html='''<a class="hotspot header-menu-item financing" href="/financing.html" aria-label="Financing"><span>Financing</span></a>'''
          new_html='''<a class="hotspot header-menu-item financing" id="header-financing-toggle" href="/financing.html" aria-label="Financing" aria-haspopup="menu" aria-expanded="false" aria-controls="financing-menu"><span>Financing <b class="markets-caret" aria-hidden="true">⌄</b></span></a>\n<nav class="financing-menu" id="financing-menu" aria-label="Liquor license financing options" hidden>\n<a href="/financing.html#how-financing-works">How Financing Works</a>\n<a href="/financing.html#borrow-to-buy-a-license">Borrow to Buy a License</a>\n<a href="/financing.html#refinance-a-license">Refinance a License</a>\n<a href="/financing.html#get-pre-qualified">Get Pre-Qualified</a>\n<a href="/financing.html#lend-against-a-license">Lend Against a License</a>\n<a href="/financing.html#lender-opportunities">Lender Opportunities</a>\n<a href="/financing.html#become-a-lender">Become a Lender</a>\n</nav>'''
          if old_html not in s:
              raise SystemExit('financing header marker not found')
          s=s.replace(old_html,new_html,1)
          marker='''</script>\n</body>\n</html>'''
          js='''</script>\n\n<script>\n(()=>{\n const toggle=document.getElementById('header-financing-toggle');\n const menu=document.getElementById('financing-menu');\n if(!toggle||!menu)return;\n let timer;\n const open=()=>{clearTimeout(timer);menu.hidden=false;toggle.setAttribute('aria-expanded','true')};\n const close=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(!toggle.matches(':hover')&&!menu.matches(':hover')&&!toggle.matches(':focus')&&!menu.matches(':focus-within')){menu.hidden=true;toggle.setAttribute('aria-expanded','false')}},160)};\n toggle.addEventListener('pointerenter',open);\n toggle.addEventListener('pointerleave',close);\n toggle.addEventListener('focus',open);\n menu.addEventListener('pointerenter',open);\n menu.addEventListener('pointerleave',close);\n menu.addEventListener('focusin',open);\n menu.addEventListener('focusout',close);\n document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.hidden=true;toggle.setAttribute('aria-expanded','false')}});\n})();\n</script>\n</body>\n</html>'''
          if marker not in s:
              raise SystemExit('closing script marker not found')
          s=s.replace(marker,js,1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/add-financing-dropdown.yml
      - name: Commit and push
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add index.html .github/workflows/add-financing-dropdown.yml
          git commit -m "Add Financing dropdown to homepage header"
          git push