name: Sync California marketplace inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-california-market-inventory.yml'
      - 'tools/update_california_market_inventory.py'
      - 'tools/inventory_dedupe.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Refresh public California marketplace inventory
        run: python tools/update_california_market_inventory.py
      - name: Commit inventory changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/california-market-inventory.json)" ]; then
            echo "No marketplace inventory changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/california-market-inventory.json
          git commit -m "Refresh California marketplace inventory"
          git push origin HEAD:main
