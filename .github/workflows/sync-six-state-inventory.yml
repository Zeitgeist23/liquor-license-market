name: Sync six state liquor license inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '11 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-six-state-inventory.yml'
      - 'tools/update_multi_state_inventory.py'
      - 'tools/inventory_dedupe.py'
      - 'tools/build_state_inventory_pages.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inventory parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Refresh six state inventory feeds
        run: python tools/update_multi_state_inventory.py
      - name: Build six state inventory pages
        run: python tools/build_state_inventory_pages.py
      - name: Wire active market links to inventory pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          states = {
              'California': 'california',
              'Arizona': 'arizona',
              'New Mexico': 'new-mexico',
              'Michigan': 'michigan',
              'Ohio': 'ohio',
              'Pennsylvania': 'pennsylvania',
              'New Jersey': 'new-jersey',
          }

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          for state, slug in states.items():
              text = text.replace(f'/browse-markets.html?state={state}', f'/{slug}/licenses-for-sale/')
              text = text.replace(f'/browse-markets.html?state={state.replace(" ", "%20")}', f'/{slug}/licenses-for-sale/')
          index.write_text(text, encoding='utf-8')

          browse = Path('browse-markets.html')
          html = browse.read_text(encoding='utf-8')
          for state, slug in states.items():
              pattern = re.compile(r'<article class="market-card">(?P<body>.*?<h2 class="state-name">' + re.escape(state) + r'</h2>.*?)</article>', re.S)
              repl = lambda m, s=state, sl=slug: f'<a class="market-card florida-card" href="/{sl}/licenses-for-sale/" aria-label="Browse {s} liquor license listings">' + m.group('body') + '</a>'
              html, _ = pattern.subn(repl, html, count=1)
          browse.write_text(html, encoding='utf-8')
          PY
      - name: Commit inventory and page updates
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data arizona new-mexico michigan ohio pennsylvania new-jersey index.html browse-markets.html)" ]; then
            echo "No six-state inventory changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data arizona new-mexico michigan ohio pennsylvania new-jersey index.html browse-markets.html
          git commit -m "Refresh six-state liquor license inventory"
          git push origin HEAD:main
