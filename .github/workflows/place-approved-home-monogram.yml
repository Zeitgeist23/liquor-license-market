name: Place approved homepage monogram

on:
  push:
    paths:
      - '.github/workflows/place-approved-home-monogram.yml'

permissions:
  contents: write

jobs:
  place-monogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Place exact approved monogram on homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove any earlier replacement image if present.
          s = re.sub(r'\n?<img class="hero-llm-(?:attached|approved)"[^>]*>\n?', '\n', s)

          # Add only the approved attached monogram above the erase layer.
          erase = '<div class="hero-crest-erase" aria-hidden="true"></div>'
          approved = erase + '\n<img class="hero-llm-approved" src="/assets/home-monogram.png" alt="LLM">'
          if erase not in s:
              raise SystemExit('homepage erase layer not found')
          s = s.replace(erase, approved, 1)

          # Add dedicated CSS without touching the rest of the hero.
          css = '.hero img.hero-llm-approved{position:absolute!important;inset:auto!important;left:3.8%!important;top:17.9%!important;width:27%!important;height:auto!important;object-fit:contain!important;z-index:32!important;display:block!important;pointer-events:none!important;user-select:none!important}'
          marker = '.hero img.hero-crest-zoom{display:none}'
          if css not in s:
              if marker not in s:
                  raise SystemExit('homepage hero CSS marker not found')
              s = s.replace(marker, marker + '\n' + css, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage monogram
        shell: bash
        run: |
          git config user.name "LLM Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Place approved monogram on homepage"
          git push origin HEAD:main
