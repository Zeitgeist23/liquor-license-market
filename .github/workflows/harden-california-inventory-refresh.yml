name: Restore complete California inventory feed

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/harden-california-inventory-refresh.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore last complete California feed
        run: git show cba108fdf99e5b11db01ad22d3af185da1e7c372:data/california-market-inventory.json > data/california-market-inventory.json
      - name: Regenerate fast bootstrap
        run: python tools/build_california_bootstrap.py
      - name: Reapply safe staged page loader
        run: |
          python tools/apply_dedupe_ui.py california
          python tools/apply_california_fastload.py
      - name: Commit restored complete California inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/california-market-inventory.json data/california-market-bootstrap.json california/licenses-for-sale/index.html
          git commit -m "Restore complete California inventory feed"
          git push origin HEAD:main
