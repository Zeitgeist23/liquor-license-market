name: Apply LLM mobile layer once

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-layer-once.yml'

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Attach mobile CSS and JS to every HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          css='  <link rel="stylesheet" href="/mobile.css?v=20260814">\n'
          js='  <script src="/mobile.js?v=20260814" defer></script>\n'
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              original=s
              if '/mobile.css' not in s and '</head>' in s:
                  s=s.replace('</head>', css+'</head>', 1)
              if '/mobile.js' not in s and '</body>' in s:
                  s=s.replace('</body>', js+'</body>', 1)
              if s != original:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print(f'Updated {len(changed)} HTML files')
          print('\n'.join(changed))
          if not changed:
              raise SystemExit('No HTML files changed')
          PY
      - name: Commit mobile layer
        shell: bash
        run: |
          git config user.name "LLM Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html' '**/*.html' || true
          git commit -m "Enable sitewide mobile responsive experience"
          git push origin HEAD:main
