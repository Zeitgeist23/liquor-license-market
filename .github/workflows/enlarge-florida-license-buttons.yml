name: Enlarge Florida license buttons
on:
  push:
    branches: [main]
jobs:
  enlarge-buttons:
    if: github.event.head_commit.message == 'Add one-time Florida license button enlarger'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge Florida license type buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='.license-type-list a,.license-type-list span{display:inline-flex;align-items:center;padding:.28vw .42vw;color:#f7e7bd;font-size:clamp(6px,.66vw,10px);line-height:1.15;text-decoration:none;border:1px solid rgba(237,169,26,.34);border-radius:99px;background:rgba(15,36,63,.95);transition:color .14s ease,background .14s ease,box-shadow .14s ease,transform .14s ease}'
          override='\n.license-type-list a{padding:.44vw .72vw;font-size:clamp(8px,.82vw,13px);font-weight:700;min-width:3.6vw;justify-content:center}'
          if override.strip() not in s:
              if marker not in s:
                  raise SystemExit('license button CSS marker not found')
              s=s.replace(marker, marker+override, 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/enlarge-florida-license-buttons.yml
      - name: Commit and push button size update
        run: |
          git config user.name 'Zeitgeist23'
          git config user.email 'JWigg023@gmail.com'
          git add index.html .github/workflows/enlarge-florida-license-buttons.yml
          git commit -m 'Enlarge Florida license type buttons'
          git push