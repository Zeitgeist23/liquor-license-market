name: Use approved LLM letter shapes

on:
  push:
    paths:
      - '.github/workflows/use-approved-letter-shapes-once.yml'

permissions:
  contents: write

jobs:
  update-monogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace text letters with approved vector shapes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<span class="monogram-mark">LLM</span>'
          path = 'M 63.25 10.50 L 63.62 11.25 L 65.50 11.88 L 67.00 13.75 L 66.88 32.12 L 67.88 33.00 L 68.38 33.00 L 68.75 32.12 L 68.88 17.75 L 69.50 17.12 L 70.88 19.75 L 72.25 24.12 L 73.88 27.50 L 74.12 28.88 L 75.75 32.62 L 76.00 34.12 L 76.75 35.50 L 77.12 37.25 L 78.62 40.62 L 79.25 43.12 L 82.00 50.38 L 82.62 51.25 L 83.38 51.25 L 84.00 50.38 L 86.12 43.62 L 88.62 37.25 L 89.12 35.00 L 89.62 34.38 L 90.00 32.50 L 90.75 31.25 L 93.00 24.25 L 93.62 23.25 L 94.88 18.75 L 95.75 18.00 L 96.25 18.62 L 96.50 20.50 L 97.00 36.75 L 97.62 41.88 L 97.75 47.25 L 96.88 49.25 L 94.00 51.25 L 94.62 51.62 L 106.50 51.50 L 106.38 50.75 L 105.50 50.62 L 104.12 49.88 L 103.00 48.12 L 102.00 33.25 L 101.88 25.88 L 101.25 19.00 L 101.25 14.88 L 101.62 13.00 L 102.62 11.88 L 104.38 11.25 L 104.62 10.88 L 104.38 10.25 L 96.38 10.25 L 95.12 12.75 L 94.88 14.25 L 94.12 15.50 L 93.00 19.50 L 92.25 20.88 L 91.75 23.12 L 89.25 29.62 L 87.75 34.75 L 86.12 38.50 L 85.75 40.25 L 84.62 41.62 L 84.00 41.12 L 78.62 25.75 L 77.00 22.25 L 76.75 20.88 L 76.00 19.50 L 75.62 17.88 L 75.00 16.88 L 74.75 15.50 L 72.75 10.62 L 72.38 10.25 L 63.50 10.25 Z M 7.50 5.38 L 7.25 6.25 L 7.62 6.62 L 9.12 6.75 L 9.88 7.12 L 10.75 8.00 L 11.12 9.38 L 11.12 41.25 L 10.75 43.38 L 9.12 44.75 L 7.25 45.00 L 7.00 45.62 L 7.75 46.12 L 33.75 45.88 L 34.25 45.38 L 34.62 44.12 L 35.12 40.75 L 36.25 36.50 L 35.88 36.25 L 35.12 36.62 L 32.12 41.25 L 30.50 42.75 L 28.62 43.88 L 25.25 44.75 L 23.62 44.88 L 18.88 44.75 L 17.00 43.75 L 16.62 42.62 L 16.62 9.50 L 17.12 7.75 L 18.25 6.88 L 20.38 6.38 L 20.50 5.50 Z M 37.88 5.50 L 37.62 5.75 L 37.75 6.25 L 39.50 6.75 L 40.75 7.62 L 41.62 9.75 L 41.62 40.88 L 41.00 43.25 L 40.38 44.12 L 39.25 45.00 L 37.75 45.25 L 37.62 45.62 L 38.25 46.00 L 50.38 46.12 L 63.62 45.88 L 64.12 45.12 L 65.25 39.00 L 65.75 37.75 L 65.75 36.62 L 65.38 36.38 L 64.75 36.75 L 63.62 39.00 L 62.00 41.12 L 58.38 43.88 L 54.38 44.88 L 50.25 44.88 L 48.50 44.50 L 47.12 43.50 L 46.75 41.25 L 46.88 9.00 L 47.25 8.00 L 48.12 7.12 L 49.00 6.75 L 51.12 6.50 L 51.50 5.75 L 51.25 5.38 L 47.88 5.25 Z'
          new = f'<svg class="monogram-art" viewBox="0 0 115 60" aria-hidden="true" focusable="false"><path d="{path}" fill="#eda91a"/></svg>'
          if old not in s:
              raise SystemExit('Current monogram text not found; refusing unsafe edit')
          s = s.replace(old, new, 1)
          css_anchor = '.hero-monogram-live .monogram-mark{flex:0 0 auto;color:#eda91a;font-family:"Times New Roman",Times,serif;font-size:2.50vw;font-weight:400;line-height:.92;letter-spacing:-.02em;text-shadow:none;transform:scaleX(.93);transform-origin:center}'
          css_new = css_anchor + '\n.hero-monogram-live .monogram-art{display:block;flex:0 0 auto;width:5.25vw;height:2.74vw;overflow:visible}'
          if css_anchor not in s:
              raise SystemExit('Current monogram CSS not found; refusing unsafe edit')
          s = s.replace(css_anchor, css_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit approved monogram letters
        shell: bash
        run: |
          git config user.name "LLM Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Use approved LLM letter shapes on homepage"
          git push origin HEAD:main
