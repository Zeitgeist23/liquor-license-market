name: Apply attached homepage monogram

on:
  push:
    paths:
      - '.github/workflows/replace-home-monogram-attached.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace homepage monogram with attached asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css_anchor='.hero img.hero-crest-zoom{display:none}'
          exact_css='.hero img.hero-llm-attached{position:absolute;inset:auto;left:3.8%;top:18.7%;width:27%;height:auto;object-fit:contain;z-index:15;display:block;pointer-events:none;user-select:none}'
          if exact_css not in s:
              if css_anchor not in s:
                  raise SystemExit('Homepage monogram CSS anchor not found; refusing unsafe edit.')
              s=s.replace(css_anchor,css_anchor+'\n'+exact_css,1)
          old='<div class="hero-crest-erase" aria-hidden="true"></div>\n<div class="hero-crest-lines" aria-hidden="true"></div>\n<div class="hero-llm-monogram" aria-label="LLM">LLM</div>'
          new='<img class="hero-llm-attached" src="/assets/home-monogram-exact.svg" alt="LLM">'
          if old in s:
              s=s.replace(old,new,1)
          elif 'class="hero-llm-attached"' not in s:
              raise SystemExit('Current homepage monogram markup not found; refusing unsafe edit.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit live homepage update
        shell: bash
        run: |
          git config user.name "LLM Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/replace-home-monogram-attached.yml
          git add index.html
          git commit -m "Replace homepage monogram with approved attached image"
          git push origin HEAD:main
